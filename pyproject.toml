[project]
name = "graphics-engine"
version = "0.1.0"
description = "A custom matrix graphics engine built with Pygame"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.1",
    "pygame>=2.6.1",
]

[tool.uv]
no-binary-package = ["pygame"]

[tool.uv.extra-build-variables]
pygame = { PYGAME_DETECT_AVX2 = "1", CFLAGS = "-mavx2" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphics_engine"]